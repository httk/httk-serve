[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httk-optimade"
version = "0.2.0"
description = "OPTIMADE API server tooling for httk₂"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Rickard Armiento", email = "rickard-gpg@armiento.net" }]
dependencies = [
  "httk-core>=2.0.0,<3",
  "httk-data>=0.1.0,<1",
  "starlette>=0.37",
  "uvicorn>=0.30",
]
keywords = [
  "Materials Discovery",
  "Materials Informatics",
  "Materials Science",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://httk.org"
Documentation = "https://docs.httk.org/httk-optimade/"
Repository = "https://github.com/httk/httk-optimade"
Issues = "https://github.com/httk/httk-optimade/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"httk.optimade" = ["py.typed"]
"httk.optimade.filter" = ["*.ebnf"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "black",
  "ruff",
  "isort",
  "pyright",
  "mypy"
]
docs = [
  "sphinx",
  "furo",
  "myst-parser",
  "myst-nb",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "sphinx-autoapi"
]
release = [
  "build>=1.2",
  "twine>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py312"
src = ["src", "examples"]

[tool.ruff.lint.per-file-ignores]
# Vendored LR(1) parser from httk v1; kept close to its upstream form.
"src/httk/optimade/filter/_miniparser.py" = ["E741", "E712"]

[tool.black]
target-version = ["py312"]
line-length = 120
skip-string-normalization = true

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "examples"]
# Vendored LR(1) parser from httk v1; kept close to its upstream form.
exclude = ["src/httk/optimade/filter/_miniparser.py"]
# Resolve third-party runtime dependencies (starlette, uvicorn) against the
# shared workspace venv; pyright falls back to default resolution where that
# venv does not exist (e.g. CI, where the deps are installed into the job env).
venvPath = ".."
venv = ".venv"
reportMissingImports = true

[tool.mypy]
python_version = "3.12"
files = ["src", "examples"]
mypy_path = ["src", "examples/demo_server"]
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Vendored LR(1) parser from httk v1; kept close to its upstream form.
module = "httk.optimade.filter._miniparser"
disable_error_code = ["var-annotated", "assignment", "arg-type", "operator", "index", "union-attr", "attr-defined", "return-value", "func-returns-value"]
