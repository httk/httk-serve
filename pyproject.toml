[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httk-optimade"
version = "0.1.0"
description = "OPTIMADE API server tooling for httk v2"
readme = "README.md"
license = "AGPL-3.0+"
requires-python = ">=3.11"
authors = [{ name = "Rickard Armiento", email = "rickard-gpg@armiento.net" }]
dependencies = [
  "starlette>=0.37",
  "uvicorn>=0.30"
]
keywords = [
  "Materials Discovery",
  "Materials Informatics",
  "Materials Science",
  "Machine Learning",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "black",
  "ruff",
  "isort",
  "pyright",
  "mypy"
]
docs = [
  "sphinx",
  "furo",
  "myst-parser",
  "myst-nb",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "sphinx-autoapi"
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"httk.optimade.filter" = ["*.ebnf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py311"
src = ["src", "examples"]

[tool.ruff.lint.per-file-ignores]
# Vendored LR(1) parser from httk v1; kept close to its upstream form.
"src/httk/optimade/filter/_miniparser.py" = ["E741", "E712"]

[tool.black]
target-version = ["py311"]
line-length = 120
skip-string-normalization = true

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "examples"]
# Vendored LR(1) parser from httk v1; kept close to its upstream form.
exclude = ["src/httk/optimade/filter/_miniparser.py"]
reportMissingImports = true
extraPaths = []

[tool.mypy]
python_version = "3.11"
files = ["src", "examples"]
mypy_path = ["src", "examples/demo_server"]
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Vendored LR(1) parser from httk v1; kept close to its upstream form.
module = "httk.optimade.filter._miniparser"
disable_error_code = ["var-annotated", "assignment", "arg-type", "operator", "index", "union-attr", "attr-defined", "return-value", "func-returns-value"]
