[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httk-serve"
version = "0.2.0"
description = "Web and OPTIMADE serving tooling for httk₂"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Rickard Armiento", email = "rickard-gpg@armiento.net" }]
dependencies = [
  "httk-core>=2.0.2,<3",
  "httk-store>=0.2.0,<1",
  "httpx>=0.27",
  "jsonschema>=4.23,<5",
  "referencing>=0.35,<1",
  "jinja2>=3.1",
  "markdown>=3.5",
  "PyYAML>=6.0",
  "docutils>=0.20",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9"
]
keywords = [
  "Materials Discovery",
  "Materials Informatics",
  "Materials Science",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://httk.org"
Documentation = "https://docs.httk.org/httk-serve/"
Repository = "https://github.com/httk/httk-serve"
Issues = "https://github.com/httk/httk-serve/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"httk.serve.web" = ["py.typed", "assets/*.css", "assets/*.js", "assets/*.mjs"]
"httk.serve.optimade" = ["py.typed"]
"httk.serve.dsp" = ["py.typed", "schemas/**/*"]
"httk.serve.dcat_ap" = ["py.typed"]
"httk.registry.cli.serve" = ["py.typed"]
"httk.registry.entries.serve" = ["py.typed"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "openapi-spec-validator>=0.7,<0.8",
  "rdflib>=7,<8",
  "pyshacl>=0.30,<1",
  "types-jsonschema",
  "ruff>=0.16,<0.17",
  "pydoclint>=0.9,<1",
  "pyright",
  "mypy"
]
docs = [
  "sphinx",
  "furo",
  "myst-parser",
  "myst-nb",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "sphinx-autoapi"
]
release = [
  "build>=1.2",
  "twine>=6.0",
]
default = []
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not extended'"
markers = [
  "extended: full-depth test case; selected only by the extended test profile",
]

[tool.ruff]
target-version = "py312"
src = ["src", "examples"]
line-length = 120

[tool.ruff.lint]
# TRY002: raising plain Exception is accepted httk style.
# TRY004: the ValueError/TypeError choice is public API; do not churn it.
# BLE001: broad excepts deliberately isolate plugin/loader/handler failures.
ignore = ["TRY002", "TRY004", "BLE001"]

[tool.ruff.format]
# preserve replaces black's skip-string-normalization: existing quote styles are kept.
quote-style = "preserve"

[tool.pydoclint]
style = "sphinx"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-class-attributes = false
skip-checking-raises = true

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "examples"]
# The legacy search-app demo is example *site content* that targets the httk v1
# full stack (httk.db, httk.atomistic.Compound), APIs with no httk₂ equivalent.
# It is not part of the distribution and cannot resolve against httk-serve's deps.
exclude = ["examples/legacy/search_app/src/functions"]
extraPaths = ["src", "../httk-store/src"]
venvPath = ".."
venv = ".venv"
reportMissingImports = true

[tool.mypy]
python_version = "3.12"
files = ["src", "examples"]
mypy_path = ["src", "examples/optimade/demo_server", "../httk-store/src"]
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml", "markdown", "docutils", "docutils.*", "jsonschema", "jsonschema.*", "referencing", "referencing.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# httk-store is type-checked in its own repository.
module = ["httk.store", "httk.store.*", "httk.registry.entries.store"]
follow_imports = "silent"
