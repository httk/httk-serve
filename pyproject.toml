[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httk-optimade"
version = "0.2.0"
description = "OPTIMADE API server tooling for httk₂"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Rickard Armiento", email = "rickard-gpg@armiento.net" }]
dependencies = [
  "httk-core>=2.0.2,<3",
  "httk-data>=0.2.0,<1",
  "httpx>=0.27",
  "starlette>=0.37",
  "uvicorn>=0.30",
]
keywords = [
  "Materials Discovery",
  "Materials Informatics",
  "Materials Science",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://httk.org"
Documentation = "https://docs.httk.org/httk-optimade/"
Repository = "https://github.com/httk/httk-optimade"
Issues = "https://github.com/httk/httk-optimade/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"httk.optimade" = ["py.typed"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.16,<0.17",
  "pyright",
  "mypy"
]
docs = [
  "sphinx",
  "furo",
  "myst-parser",
  "myst-nb",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "sphinx-autoapi"
]
release = [
  "build>=1.2",
  "twine>=6.0",
]
default = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not extended'"
markers = [
  "extended: full-depth test case; selected only by the extended test profile",
]

[tool.ruff]
target-version = "py312"
src = ["src", "examples"]
line-length = 120

[tool.ruff.lint]
# TRY002: raising plain Exception is accepted httk style.
# TRY004: the ValueError/TypeError choice is public API; do not churn it.
# BLE001: broad excepts deliberately isolate plugin/loader/handler failures.
ignore = ["TRY002", "TRY004", "BLE001"]

[tool.ruff.format]
# preserve replaces black's skip-string-normalization: existing quote styles are kept.
quote-style = "preserve"

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "examples"]
# Resolve third-party runtime dependencies (starlette, uvicorn) against the
# shared workspace venv; pyright falls back to default resolution where that
# venv does not exist (e.g. CI, where the deps are installed into the job env).
venvPath = ".."
venv = ".venv"
# Resolve the httk-data runtime dependency (httk.data.query) against its
# workspace checkout; harmless where that path does not exist (e.g. CI, where
# httk-data is installed into the job env). Listing extraPaths explicitly
# disables pyright's implicit use of ./src, so it is listed too.
extraPaths = ["src", "../httk-data/src"]
reportMissingImports = true

[tool.mypy]
python_version = "3.12"
files = ["src", "examples"]
mypy_path = ["src", "examples/demo_server", "../httk-data/src"]
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Use httk-data's types (resolved via mypy_path against its workspace
# checkout) without re-checking its files here; httk-data runs its own mypy
# with its own overrides (e.g. for untyped jsonschema).
module = ["httk.data", "httk.data.*", "httk.registry.data"]
follow_imports = "silent"
